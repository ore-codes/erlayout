name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --only-group dev
      - run: uv run --no-sync ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra test
      - run: uv run --no-sync pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t erlayout .
      - name: Container starts and reports healthy
        run: |
          docker run -d --name erlayout -p 8000:8000 erlayout
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8000/health && exit 0
            sleep 2
          done
          docker logs erlayout
          exit 1
