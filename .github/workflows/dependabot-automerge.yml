name: Dependabot auto-merge

# Turns on auto-merge for Dependabot's patch and minor updates, so they merge
# once the required CI checks pass. OR-Tools is left for a manual look because
# a new version can change what the solver finds; major updates always wait.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: >-
          steps.meta.outputs.update-type != 'version-update:semver-major'
          && !contains(steps.meta.outputs.dependency-names, 'ortools')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
