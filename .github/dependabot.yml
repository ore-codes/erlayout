version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The image's Python version moves with the CI test matrix and OR-Tools
      # wheel support, so it is changed by hand rather than by Dependabot.
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
