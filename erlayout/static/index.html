<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>erlayout · certified ER layout</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1c2230; --muted: #6b7280; --line: #dedbd2;
    --accent: #2f6fb3; --good: #1f7a4d; --good-bg: #e6f3ec; --warn: #9a6200; --warn-bg: #fbf1dc;
    --bad: #a3322a; --bad-bg: #f8e4e1;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 14px/1.45 Inter, "Segoe UI", Helvetica, Arial, sans-serif; color: var(--ink); background: var(--bg); }
  header { display: flex; align-items: baseline; gap: 14px; padding: 14px 22px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 17px; margin: 0; letter-spacing: -0.01em; }
  header span { color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(300px, 380px) 1fr; height: calc(100vh - 53px); }
  aside { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; padding: 16px; gap: 12px; min-height: 0; }
  textarea { flex: 1; min-height: 180px; width: 100%; resize: none; font: 12.5px/1.5 ui-monospace, Menlo, Consolas, monospace; border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: #fcfcfa; color: var(--ink); }
  .row { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  select, input { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); }
  button { font: inherit; font-weight: 600; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .55; cursor: progress; }
  .link { background: none; border: none; color: var(--accent); padding: 0; font-weight: 500; }
  section { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .status { padding: 14px 22px; border-bottom: 1px solid var(--line); background: var(--panel); display: grid; gap: 10px; }
  .badge { display: inline-block; padding: 6px 10px; border-radius: 6px; font-weight: 600; }
  .badge.good { background: var(--good-bg); color: var(--good); }
  .badge.warn { background: var(--warn-bg); color: var(--warn); }
  .badge.bad { background: var(--bad-bg); color: var(--bad); }
  .stats { display: flex; gap: 26px; flex-wrap: wrap; }
  .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 12px; }
  .tabs { display: flex; gap: 6px; }
  .tabs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  #canvas { flex: 1; overflow: hidden; position: relative; cursor: grab; background: #fafaf8; }
  #canvas.drag { cursor: grabbing; }
  #stage { transform-origin: 0 0; position: absolute; left: 0; top: 0; }
  .empty { color: var(--muted); padding: 40px; }
  details { color: var(--muted); font-size: 12.5px; }
  pre { margin: 6px 0 0; font-size: 12px; white-space: pre-wrap; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; height: auto; } #canvas { height: 70vh; } }
</style>
</head>
<body>
<header><h1>erlayout</h1><span>Fewest possible line crossings, with a proof.</span></header>
<main>
  <aside>
    <div class="row" style="justify-content: space-between">
      <strong>Schema</strong>
      <button class="link" id="example">Load example</button>
    </div>
    <textarea id="schema" spellcheck="false" placeholder="Paste CREATE TABLE statements, DBML, or JSON"></textarea>
    <div class="row">
      <label>Format
        <select id="format"><option value="">Auto</option><option>sql</option><option>dbml</option><option>json</option></select>
      </label>
      <label>Columns
        <select id="k"><option value="">Auto</option></select>
      </label>
      <label>Row order
        <select id="rows">
          <option value="keep" selected>Keep as is</option>
          <option value="reorder">Reorder, primary key on top</option>
          <option value="reorder-free">Reorder freely</option>
        </select>
      </label>
      <label>Time budget
        <select id="time"><option value="30">30 s</option><option value="120">2 min</option><option value="300" selected>5 min</option><option value="600">10 min</option><option value="1800">30 min</option></select>
      </label>
    </div>
    <div class="row">
      <button class="primary" id="go">Lay out</button>
      <button id="dl" disabled>Download SVG</button>
    </div>
    <div id="err" class="badge bad" hidden></div>
  </aside>
  <section>
    <div class="status" id="status" hidden>
      <div><span class="badge" id="badge"></span></div>
      <div class="stats" id="stats"></div>
      <div class="tabs"><button class="on" data-v="opt">Optimal layout</button><button data-v="base">Baseline</button></div>
      <details><summary>Search log and verification</summary><pre id="log"></pre></details>
    </div>
    <div id="canvas"><div id="stage"><div class="empty">Paste a schema and press <b>Lay out</b>.</div></div></div>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
for (let k = 2; k <= 12; k++) $('#k').insertAdjacentHTML('beforeend', `<option>${k}</option>`);
let result = null, base = null, view = 'opt';
let scale = 1, tx = 0, ty = 0;

function applyT() { $('#stage').style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; }
function fit() {
  const svg = $('#stage svg'); if (!svg) return;
  const c = $('#canvas').getBoundingClientRect();
  const w = svg.width.baseVal.value, h = svg.height.baseVal.value;
  scale = Math.min(c.width / w, c.height / h, 1) * 0.96; tx = (c.width - w * scale) / 2; ty = 10; applyT();
}
function show() {
  const src = view === 'opt' ? result?.svg : base?.svg;
  $('#stage').innerHTML = src || '<div class="empty">Computing…</div>';
  if (view === 'opt') drawn = result?.svg ?? null;
  fit();
}
$('#canvas').addEventListener('wheel', e => {
  e.preventDefault();
  const r = $('#canvas').getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const f = Math.exp(-e.deltaY * 0.0015), ns = Math.min(4, Math.max(0.1, scale * f));
  tx = mx - (mx - tx) * ns / scale; ty = my - (my - ty) * ns / scale; scale = ns; applyT();
}, { passive: false });
let drag = null;
$('#canvas').addEventListener('pointerdown', e => { drag = [e.clientX - tx, e.clientY - ty]; $('#canvas').classList.add('drag'); });
window.addEventListener('pointermove', e => { if (drag) { tx = e.clientX - drag[0]; ty = e.clientY - drag[1]; applyT(); } });
window.addEventListener('pointerup', () => { drag = null; $('#canvas').classList.remove('drag'); });
window.addEventListener('resize', fit);

document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  view = b.dataset.v; show();
});
$('#example').onclick = async () => { $('#schema').value = await (await fetch('/api/example')).text(); };
$('#dl').onclick = () => {
  const src = view === 'opt' ? result?.svg : base?.svg; if (!src) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([src], { type: 'image/svg+xml' }));
  a.download = view === 'opt' ? 'er-optimal.svg' : 'er-baseline.svg'; a.click();
};

let pollTimer = null, drawn = null;
const PHASES = { starting: 'Starting', main: 'Searching', wider: 'Trying wider layouts', solve: 'Searching',
                 bound: 'Proving a lower bound', compact: 'Trying narrower layouts' };
function render(job, final) {
  result = job;
  const proven = final && job.status === 'OPTIMAL';
  $('#badge').className = 'badge ' + (proven ? 'good' : 'warn');
  $('#badge').textContent = final ? job.guarantee
    : `${PHASES[job.phase] || 'Searching'}… best so far: ${job.crossings ?? '–'} crossings`
      + (job.lower_bound ? `, at least ${job.lower_bound} unavoidable` : '')
      + ` (${Math.round(job.elapsed)} of ${Math.round(job.time_limit)} s). The diagram updates as better layouts are found.`;
  const stats = [
    [job.crossings ?? '–', 'crossings'],
    [base ? base.crossings : '–', 'baseline (barycenter)'],
    [job.columns_used ?? '–', 'columns'],
    [`${job.tables} / ${job.edges}`, 'tables / foreign keys'],
    [final ? `${job.time_to_best} s` : (job.best_at != null ? `${job.best_at} s` : '–'), 'time to best layout']];
  $('#stats').innerHTML = stats.map(([v, l]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('');
  $('#log').textContent = final
    ? (job.history || []).map(h => `k=${h.k}: ${h.status || h.error}  crossings=${h.crossings ?? '–'}  ${h.seconds ?? ''}s`).join('\n')
      + (Object.keys(job.row_order || {}).length
          ? '\n\nReordered tables:\n' + Object.entries(job.row_order).map(([t, o]) => `  ${t}: ${o.join(', ')}`).join('\n') : '')
      + '\n\nIndependent checks: ' + JSON.stringify(job.verification)
    : `phase: ${job.phase}, improvements so far: ${job.improvements}`;
  $('#status').hidden = false;
  if (job.svg && job.svg !== drawn && view === 'opt') {
    const first = drawn === null; drawn = job.svg;
    if (first) show(); else { const keep = [scale, tx, ty]; $('#stage').innerHTML = job.svg; [scale, tx, ty] = keep; applyT(); }
    $('#dl').disabled = false;
  }
}
$('#go').onclick = async () => {
  const body = { text: $('#schema').value, format: $('#format').value || null,
                 k: $('#k').value ? +$('#k').value : null, time_limit: +$('#time').value,
                 rows: $('#rows').value };
  clearTimeout(pollTimer);
  $('#err').hidden = true; $('#go').disabled = true; $('#go').textContent = 'Solving…';
  result = null; base = null; drawn = null; show();
  const post = (url) => fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  try {
    const r = await post('/api/jobs');
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    const { id } = await r.json();
    post('/api/baseline').then(x => x.ok ? x.json() : null).then(b => { base = b; });
    const poll = async () => {
      try {
        const job = await (await fetch(`/api/jobs/${id}`)).json();
        if (job.done && job.error) throw new Error(job.error);
        render(job, job.done);
        if (job.done) { $('#go').disabled = false; $('#go').textContent = 'Lay out'; return; }
      } catch (e) {
        $('#err').textContent = e.message; $('#err').hidden = false;
        $('#go').disabled = false; $('#go').textContent = 'Lay out'; return;
      }
      pollTimer = setTimeout(poll, 1500);
    };
    poll();
  } catch (e) {
    $('#err').textContent = e.message; $('#err').hidden = false;
    $('#stage').innerHTML = '<div class="empty">No layout.</div>';
    $('#go').disabled = false; $('#go').textContent = 'Lay out';
  }
};
</script>
</body>
</html>
