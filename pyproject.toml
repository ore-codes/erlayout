[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "erlayout"
version = "0.1.0"
description = "Provably crossing-optimal layered layout of ER diagrams (CP-SAT)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Ore Adeleye"}]
requires-python = ">=3.10"
keywords = ["er-diagram", "erd", "database", "schema", "diagram", "graph-layout", "dbml", "sql", "drawio", "excalidraw", "mermaid"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["ortools>=9.10", "sqlglot>=25", "numpy", "fastapi", "uvicorn", "pydantic>=2"]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[project.urls]
Homepage = "https://github.com/ore-codes/erlayout"
Source = "https://github.com/ore-codes/erlayout"
Issues = "https://github.com/ore-codes/erlayout/issues"
"dbdiagram guide" = "https://github.com/ore-codes/erlayout/blob/master/docs/dbdiagram.md"

[project.scripts]
erlayout = "erlayout.cli:main"

[tool.setuptools]
packages = ["erlayout"]

[tool.setuptools.package-data]
erlayout = ["static/*"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]

[dependency-groups]
dev = ["ruff>=0.17"]
images = ["resvg-py>=0.5"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# the code uses compact one-line statements; B023: helpers are called in the
# iteration that defines them; B905: zip lengths are equal by construction
ignore = ["E701", "E702", "E731", "E741", "B023", "B905"]
