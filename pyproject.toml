[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "erlayout"
version = "0.1.0"
description = "Provably crossing-optimal layered layout of ER diagrams (CP-SAT)"
authors = [{name = "Oreoluwa Adeleye"}]
requires-python = ">=3.10"
dependencies = ["ortools>=9.10", "sqlglot>=25", "numpy", "fastapi", "uvicorn", "pydantic>=2"]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[project.scripts]
erlayout = "erlayout.cli:main"

[tool.setuptools]
packages = ["erlayout"]

[tool.setuptools.package-data]
erlayout = ["static/*"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]

[dependency-groups]
dev = ["ruff>=0.17"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# the code uses compact one-line statements; B023: helpers are called in the
# iteration that defines them; B905: zip lengths are equal by construction
ignore = ["E701", "E702", "E731", "E741", "B023", "B905"]
